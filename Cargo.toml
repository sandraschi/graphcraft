[workspace]
members = [
    "crates/graphcraft-core",
    "crates/graphcraft-mcp",
    "crates/graphcraft-app",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Sandra Schipal <sandraschipal@gmail.com>"]
repository = "https://github.com/sandraschi/graphcraft"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
petgraph = { version = "0.6", features = ["serde-1"] }
thiserror = "2.0"
clap = { version = "4", features = ["derive"] }
eframe = "0.37"
egui_kittest = "0.37"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
